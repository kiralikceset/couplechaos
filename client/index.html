<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07060A" />
    <!-- The app is dark by design: tells phone browsers not to re-colour it with their own "dark mode". -->
    <meta name="color-scheme" content="dark only" />
    <meta name="supported-color-schemes" content="dark" />
    <meta name="darkreader-lock" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Couple Chaos" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Couple Chaos</title>
    <meta name="description" content="The drawing game for couples: one of you describes a funny couple scene, the other draws it, and an AI judge roasts the result." />
    <!-- Link previews (WhatsApp, iMessage, Instagram DMs) for invite links. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Couple Chaos" />
    <meta property="og:title" content="Couple Chaos — a drawing duel for two" />
    <meta property="og:description" content="Describe it, draw it, guess it. Then let the AI judge roast your drawing." />
    <meta property="og:image" content="%VITE_GAME_SERVER_URL%/images/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Couple Chaos: a couple's drawing next to the AI judge's score" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- Same local fonts; start fetching before React discovers text. -->
    <link rel="preload" as="font" type="font/woff" crossorigin href="/fonts/QGYyz_MVcBeNP4NjuGObqx1XmO1I4QK1C4E.woff" />
    <link rel="preload" as="font" type="font/woff" crossorigin href="/fonts/QGYyz_MVcBeNP4NjuGObqx1XmO1I4deyC4E.woff" />
    <link rel="preload" as="font" type="font/woff" crossorigin href="/fonts/V8mQoQDjQSkFtoMM3T6r8E7mF71Q-gOoraIAEj4PVksj.woff" />
    <link rel="preload" as="image" href="/images/onboarding-couple.webp" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
